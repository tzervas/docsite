[package]
name = "docsite"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
description = "Fleet policy documentation site (mdBook); structural tests for vendored rulesets"
repository = "https://github.com/tzervas/docsite"
readme = "README.md"
publish = false
keywords = ["mdbook", "documentation", "fleet"]
categories = ["development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "docsite"
path = "src_rs/lib.rs"

[[bin]]
name = "docsite-pin"
path = "src_rs/bin/pin.rs"

[lints.rust]
unsafe_code = "forbid"
